<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تقويم دوري روشن 2026/2027 · Roshn League Calendar</title>
  <meta name="description" content="تقويم دوري روشن السعودي — اختر فرقك وأضف مبارياتها إلى تقويمك · Roshn Saudi League calendar." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="hero-top">
        <span class="kicker" id="kicker">⚽ تقويم الدوري</span>
        <button class="lang-btn" id="langBtn" type="button">English</button>
      </div>
      <h1 id="seasonTitle">دوري روشن السعودي 2026 / 2027</h1>
      <p id="seasonMeta">…</p>
    </header>

    <div class="notice" id="notice"></div>

    <div id="nextMatch"></div>

    <div class="stats">
      <div class="stat"><div class="n" id="selCount">0</div><div class="l" id="stat_teams_l"></div></div>
      <div class="stat"><div class="n" id="matchCount">0</div><div class="l" id="stat_shown_l"></div></div>
      <div class="stat"><div class="n">18</div><div class="l" id="stat_total_l"></div></div>
    </div>

    <section class="section">
      <div class="section-head">
        <div>
          <h2 id="pick_h"></h2>
          <div class="sub" id="pick_sub"></div>
        </div>
        <div class="toolbar">
          <button class="link-btn" id="selectAll"></button>
          <button class="link-btn" id="clearAll"></button>
        </div>
      </div>
      <div class="team-grid" id="teamGrid"></div>
    </section>

    <div class="actionbar">
      <div class="info"><span id="your_teams_l"></span>: <b id="your_teams_v">—</b> ·
        <button class="link-btn" id="onlyToggle" aria-pressed="false"></button></div>
      <span class="grow"></span>
      <button class="bulk" id="bulkBtn" disabled></button>
    </div>

    <section class="section">
      <div class="section-head">
        <div><h2 id="matches_h"></h2><div class="sub" id="matches_sub"></div></div>
      </div>
      <div id="matches"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <div><h2 id="sub_h"></h2><div class="sub" id="sub_sub"></div></div>
      </div>
      <div class="sub-box">
        <div class="sub-actions">
          <button class="link-btn on" id="subAll"></button>
          <button class="link-btn" id="subCopy"></button>
          <button class="link-btn" id="subDl"></button>
        </div>
        <div class="sub-teams-h" id="sub_teams_h"></div>
        <div class="sub-teams" id="subTeams"></div>
        <p class="sub-note" id="sub_note"></p>
      </div>
    </section>

    <footer>
      <p id="foot1"></p>
      <p id="foot2"></p>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="schedule.js"></script>
  <script src="app.js"></script>
</body>
</html>
